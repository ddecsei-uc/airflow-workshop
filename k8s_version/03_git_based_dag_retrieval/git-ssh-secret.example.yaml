apiVersion: v1
kind: Secret
metadata:
  name: airflow-git-ssh
  namespace: airflow
type: Opaque
stringData:
  # Replace with deploy key content for your DAG repo
  ssh: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    <replace-me>
    -----END OPENSSH PRIVATE KEY-----

  # Pin host key(s) for your git host
  known_hosts: |
    github.com ssh-ed25519 <replace-me>
