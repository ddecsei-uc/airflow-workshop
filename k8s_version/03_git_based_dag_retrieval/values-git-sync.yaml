# Overlay values for Airflow Helm chart DAG git-sync
# Use with:
#   helm upgrade --install airflow apache-airflow/airflow \
#     -n airflow \
#     -f 01_install/values-airflow.yaml \
#     -f 03_git_based_dag_retrieval/values-git-sync.yaml

dags:
  persistence:
    enabled: false

  gitSync:
    enabled: true
    repo: https://github.com/DecseiD/airflow-workshop.git
    branch: main
    rev: HEAD
    depth: 1
    wait: 30 # Sync interval in seconds (checks repo for changes every 30s)

    # CRITICAL: subPath is RELATIVE TO THE ROOT of the cloned git repository.
    # In https://github.com/DecseiD/airflow-workshop.git, the repo root contains k8s_version/ directly.
    # (Do NOT include repo name or leading slashes).
    subPath: "k8s_version/03_git_based_dag_retrieval/dags"

    # For private repos, configure authentication secret:
    # credentialsSecret: airflow-git-https
    # sshKeySecret: airflow-git-ssh
    # knownHosts: |
    #   github.com ssh-ed25519 AAAA...

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
