# Airflow Helm values for AKS workshop
# Chart: apache-airflow/airflow

executor: KubernetesExecutor

defaultAirflowTag: "2.11.0"
airflowVersion: "2.11.0"

createUserJob:
  useHelmHooks: false

migrateDatabaseJob:
  useHelmHooks: false

webserver:
  replicas: 1
  service:
    type: LoadBalancer
  webserverConfig: |
    import os
    from flask_appbuilder.const import AUTH_OAUTH

    AUTH_TYPE = AUTH_OAUTH
    AUTH_ROLES_SYNC_AT_LOGIN = False
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Admin"

    OAUTH_PROVIDERS = [
      {
        "name": "azure",
        "icon": "fa-windows",
        "token_key": "access_token",
        "remote_app": {
          "client_id": os.environ.get("AZURE_CLIENT_ID"),
          "client_secret": os.environ.get("AZURE_CLIENT_SECRET"),
          "server_metadata_url": f"https://login.microsoftonline.com/{os.environ.get('AZURE_TENANT_ID')}/v2.0/.well-known/openid-configuration",
          "client_kwargs": {"scope": "openid email profile"},
        },
      }
    ]

ingress:
  web:
    enabled: true
    ingressClassName: nginx
    host: airflow.local
    path: "/"
    tls:
      enabled: false

dags:
  persistence:
    enabled: false

# Airflow Core Config: Enable Azure Blob Remote Logging
config:
  logging:
    remote_logging: "True"
    remote_log_conn_id: "wasb_default"
    remote_base_log_folder: "wasb://airflow-logs"
    delete_local_logs: "False"
  azure_remote_logging:
    remote_wasb_log_container: "airflow-logs"

logs:
  persistence:
    enabled: false # Disabled in favor of cloud-native Azure Blob Storage remote logging

postgresql:
  enabled: true
  auth:
    username: airflow
    password: airflow
    database: airflow

extraEnv: |
  - name: AZURE_TENANT_ID
    valueFrom:
      secretKeyRef:
        name: airflow-entra-auth
        key: AZURE_TENANT_ID
  - name: AZURE_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: airflow-entra-auth
        key: AZURE_CLIENT_ID
  - name: AZURE_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: airflow-entra-auth
        key: AZURE_CLIENT_SECRET
  - name: AIRFLOW__WEBSERVER__RBAC
    value: "True"
  - name: AIRFLOW__CORE__AUTH_MANAGER
    value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  - name: AIRFLOW_CONN_IOT_DB_CONN
    value: postgresql://iot_user:iot_password@iot-telemetry-db.airflow.svc.cluster.local:5432/iot_telemetry
  - name: AIRFLOW_CONN_WASB_DEFAULT
    valueFrom:
      secretKeyRef:
        name: airflow-azure-storage
        key: AIRFLOW_CONN_WASB_DEFAULT
